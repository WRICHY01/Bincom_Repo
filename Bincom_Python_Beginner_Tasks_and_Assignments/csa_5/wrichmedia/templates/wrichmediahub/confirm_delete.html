{% extends 'base.html' %}

{% block title %}Delete Post — wrichmediahub{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 text-center">
        <h3 class="fw-bold mb-3">Delete this post?</h3>
        <p class="text-muted">
            "<strong>{{ post.title }}</strong>" will be permanently deleted
            along with all its media. This cannot be undone.
        </p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger me-2">
                Yes, Delete
            </button>
            <a href="{% url 'home' %}" class="btn btn-outline-secondary">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
